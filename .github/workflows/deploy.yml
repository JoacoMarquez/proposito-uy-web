name: Deploy a Cloudflare

# Despliega la web a Cloudflare Workers en cada push a main.
# También permite disparar el deploy manualmente desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita deploys solapados: si entra un push nuevo, cancela el anterior en curso.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Necesario en build (el cliente Neon se inicializa de forma diferida,
          # pero algunas rutas SSR lo requieren si se prerenderizan).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy con Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler.jsonc ya define name, main y assets.
          command: deploy
